name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint check frontend
        run: bun run lint
        working-directory: ./apps/frontend

      - name: Type check frontend
        run: bunx tsc --noEmit
        working-directory: ./apps/frontend
        
      - name: Prettier check frontend
        run: bunx prettier --check "src/**/*.{ts,tsx,js,jsx}"
        working-directory: ./apps/frontend
        
      # 修正したコードを再コミット
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: format and lint"
          branch: main