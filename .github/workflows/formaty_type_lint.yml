name: Run format typecheck lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    # PRに適切な権限を付与
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Frontend checks
      - name: Lint check frontend
        run: bun run lint
        working-directory: ./apps/frontend

      - name: Type check frontend
        run: bunx tsc --noEmit
        working-directory: ./apps/frontend
        
      - name: Prettier format frontend
        run: bunx prettier --write "src/**/*.{ts,tsx,js,jsx}"
        working-directory: ./apps/frontend
        
      # Backend checks
      - name: Type check backend
        run: bunx tsc --noEmit
        working-directory: ./apps/backend
        
      - name: Prettier format backend
        run: bunx prettier --write "**/*.{ts,js}"
        working-directory: ./apps/backend
        
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
    
